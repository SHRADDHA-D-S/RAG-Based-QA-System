[project]
name = "rag-based-qa-system"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Panchanan Sahoo", email = "javasahooai@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "datasets>=5.1.0",
    "docling>=2.134.0",
    "groq>=1.7.0",
    "langchain>=1.4.3",
    "langchain-community>=0.4.2",
    "langchain-text-splitters>=1.1.3",
    "numpy>=2.5.3",
    "openai>=3.24.0",
    "pandas>=3.0.6",
    "pinecone>=10.0.0",
    "python-dotenv>=1.2.4",
    "sentence-transformers>=6.1.0",
]


[project.scripts]
rag-based-qa-system = "rag_based_qa_system:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "rag"
module-root = "src"
